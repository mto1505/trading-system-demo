# =============================================================================
# values.yaml — Giá trị mặc định (Base)
# Tương đương k8s/base + config/trading.env trong cấu trúc Kustomize.
# Overlay-specific values nằm ở values-{dev,staging,prod}.yaml.
# =============================================================================

global:
  partOf: trading-system

# Namespace
namespace:
  create: true

# ---------------------------------------------------------------------------
# Hạ tầng: bật/tắt từng thành phần
# ---------------------------------------------------------------------------
postgres:
  enabled: true          # false ở prod → dùng RDS
  image: postgres:16.4-alpine
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  storage: 1Gi

kafka:
  enabled: true          # false ở prod → dùng managed Kafka
  # apache/kafka, KHONG phai bitnami: kafka-topics-job.yaml goi /opt/kafka/bin/*.sh
  # (layout cua apache). Bitnami dat script o /opt/bitnami/kafka/bin va tu 2025
  # da go image public tren Docker Hub -> ErrImagePull "not found".
  # Dong bo voi k8s/base/infra/kafka.yaml.
  image: apache/kafka:3.7.0
  # Heap cua broker. PHAI thap hon resources.limits.memory it nhat ~250Mi.
  # Ha limit ma quen ha dong nay = OOMKilled.
  heapOpts: "-Xms512m -Xmx1g"
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 1Gi }
  storage: 2Gi

kafkaTopicsJob:
  enabled: true          # false khi kafka.enabled=false (managed tự tạo topic)
  # apache/kafka, KHONG phai bitnami: kafka-topics-job.yaml goi /opt/kafka/bin/*.sh
  # (layout cua apache). Bitnami dat script o /opt/bitnami/kafka/bin va tu 2025
  # da go image public tren Docker Hub -> ErrImagePull "not found".
  # Dong bo voi k8s/base/infra/kafka.yaml.
  image: apache/kafka:3.7.0

redis:
  enabled: true
  image: redis:7.2-alpine
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 96Mi }

schemaRegistry:
  enabled: true
  image: confluentinc/cp-schema-registry:7.7.0
  # Mac dinh cua image la -Xmx512M. Ha limits.memory xuong duoi do ma quen
  # dong nay = OOMKilled luc khoi dong.
  heapOpts: "-Xmx512m"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

zipkin:
  enabled: true
  image: openzipkin/zipkin-slim:3.4
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

# ---------------------------------------------------------------------------
# Prometheus in-cluster (tối giản, cho dev)
# ---------------------------------------------------------------------------
prometheus:
  inCluster:
    enabled: false       # dev bật, staging/prod dùng kube-prometheus-stack
  image: prom/prometheus:v2.54.1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

# ---------------------------------------------------------------------------
# Monitoring: PodMonitor + ServiceMonitor (cần Prometheus Operator)
# ---------------------------------------------------------------------------
monitoring:
  enabled: false         # staging/prod bật
  # Namespace cua kube-prometheus-stack. Dung de mo NetworkPolicy ingress cho scrape.
  namespace: monitoring
  # kube-prometheus-stack MAC DINH chi nhan PodMonitor/ServiceMonitor mang label
  # `release: <ten-release-cua-stack>` (podMonitorSelector). Thieu label nay thi
  # object van duoc tao ra nhung Prometheus KHONG BAO GIO doc toi.
  # Kiem tra: kubectl -n monitoring get prometheus -o yaml | grep -A5 podMonitorSelector
  extraLabels: {}
    # release: kube-prometheus-stack

# ---------------------------------------------------------------------------
# KEDA: autoscale consumer theo Kafka lag
# ---------------------------------------------------------------------------
keda:
  enabled: false         # staging/prod bật
  # Namespace cai KEDA operator. Dung cho NetworkPolicy mo duong cho no toi broker.
  namespace: keda
  pollingInterval: 15
  cooldownPeriod: 120
  # stabilizationWindowSeconds MOI la thu chong flapping khi minReplicaCount >= 1.
  # cooldownPeriod cua KEDA CHI ap cho truong hop co ve 0 replica.
  scaleDownStabilizationSeconds: 300
  pricingRiskService:
    minReplicaCount: 1
    # maxReplicaCount KHONG duoc vuot partition / setConcurrency(3) trong
    # pricing-risk-service/config/KafkaConfig.java. Prod 12 partition -> 4.
    maxReplicaCount: 4
    # Topic + group PHAI khop @KafkaListener trong code:
    #   TickConsumer.java  -> topics = "stock.ticks"
    #   KafkaConfig.java   -> GROUP_ID_CONFIG = "pricing-risk-group"
    topic: stock.ticks
    consumerGroup: pricing-risk-group
    # lagThreshold la lag TREN MOI REPLICA: desired = ceil(tong_lag / threshold).
    lagThreshold: "1000"
    activationLagThreshold: "100"
  matchingEngine:
    minReplicaCount: 1
    maxReplicaCount: 4
    # OrderConsumer.java -> topics = "stock.orders", groupId = "matching-engine-group"
    topic: stock.orders
    consumerGroup: matching-engine-group
    lagThreshold: "500"
    activationLagThreshold: "100"

# ---------------------------------------------------------------------------
# External Secrets (ESO): dùng cho prod thay vì secretGenerator
# ---------------------------------------------------------------------------
externalSecrets:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  data:
    dbKey: trading/prod/db
    apiKey: trading/prod/api

# ---------------------------------------------------------------------------
# PriorityClass (chỉ prod)
# ---------------------------------------------------------------------------
priorityClass:
  enabled: false
  value: 1000000

# ---------------------------------------------------------------------------
# ConfigMap — trading-config
# Tương đương configMapGenerator + base/config/trading.env
# ---------------------------------------------------------------------------
config:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: trading
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP: "kafka-0.kafka.trading.svc.cluster.local:9092"
  KAFKA_PARTITIONS: "3"
  KAFKA_TOPIC_REPLICAS: "1"
  SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
  ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
  TRACING_PROBABILITY: "0.1"
  SIMULATED_FEED: "true"
  OUTBOX_RELAY_ENABLED: "true"
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_TRADING: "INFO"

# ---------------------------------------------------------------------------
# Secret — trading-secrets (dev/staging dùng trực tiếp, prod dùng ESO)
# ---------------------------------------------------------------------------
secrets:
  create: true
  DB_USER: trading
  DB_PASSWORD: ""
  ORDER_API_KEY: ""

# ---------------------------------------------------------------------------
# 4 Service nghiệp vụ
# ---------------------------------------------------------------------------
marketGateway:
  replicaCount: 1
  image:
    repository: ghcr.io/trading-system/market-gateway
    tag: ""
    digest: ""
  # PHAI khop server.port trong market-gateway/src/main/resources/application.yml (8081).
  # Sai port -> startupProbe khong bao gio 200 -> pod khong bao gio Ready.
  port: 8081
  component: gateway
  resources:
    requests: { cpu: 200m, memory: 384Mi }
    limits: { memory: 512Mi }
  topologySpread:
    enabled: false
    whenUnsatisfiable: ScheduleAnyway

pricingRiskService:
  replicaCount: 1
  image:
    repository: ghcr.io/trading-system/pricing-risk-service
    tag: ""
    digest: ""
  # PHAI khop server.port trong pricing-risk-service/.../application.yml (8082).
  port: 8082
  component: pricing
  resources:
    requests: { cpu: 200m, memory: 384Mi }
    limits: { memory: 512Mi }
  topologySpread:
    enabled: true
    whenUnsatisfiable: ScheduleAnyway

orderService:
  replicaCount: 2
  image:
    repository: ghcr.io/trading-system/order-service
    tag: ""
    digest: ""
  port: 8083
  component: order
  resources:
    requests: { cpu: 200m, memory: 384Mi }
    limits: { memory: 512Mi }
  topologySpread:
    enabled: true
    whenUnsatisfiable: ScheduleAnyway
  strategy:
    maxSurge: 1
    maxUnavailable: 0
  minReadySeconds: 15
  progressDeadlineSeconds: 600
  terminationGracePeriodSeconds: 60
  initContainers:
    waitForDb: true
  pdb:
    enabled: true
    # maxUnavailable, KHONG phai minAvailable — xem ghi chu trong templates/apps/order-service.yaml
    maxUnavailable: 1

matchingEngine:
  replicaCount: 1
  image:
    repository: ghcr.io/trading-system/matching-engine
    tag: ""
    digest: ""
  # PHAI khop server.port trong matching-engine/.../application.yml (8084).
  port: 8084
  component: matching
  resources:
    requests: { cpu: 200m, memory: 384Mi }
    limits: { memory: 512Mi }
  topologySpread:
    enabled: true
    whenUnsatisfiable: ScheduleAnyway

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  host: trading.local
  # Namespace cua ingress controller — dung cho NetworkPolicy mo duong cho no.
  controllerNamespace: ingress-nginx
  # ---------------------------------------------------------------------------
  # Route: moi muc sinh RA HAI thu — mot path trong Ingress VA mot NetworkPolicy
  # cho phep nginx toi dung service do. Them route o day la du, khong phai sua
  # cho nao khac.
  #
  # `service` phai la mot trong 4 ten co trong trading.servicePorts
  # (_helpers.tpl), neu khong render se chet voi loi index nil.
  #
  # pathType Prefix: /api/v1/orders cung bat /api/v1/orders/{clientOrderId}.
  # ---------------------------------------------------------------------------
  routes:
    - path: /api/v1/orders
      service: order-service
    - path: /api/v1/marketdata
      service: pricing-risk-service
  tls:
    enabled: true
    secretName: trading-tls
    # cert-manager Issuer tự ký, dùng cho môi trường KHÔNG ra được Internet
    # (local/staging nội bộ) — nơi ACME/Let's Encrypt không chạy được.
    #
    # PHẢI khai báo ở đây dù mặc định là false: templates/ingress.yaml đọc
    # .selfSignedIssuer.enabled, và nếu khoá này không tồn tại thì render CHẾT
    # ngay khi tls.enabled=true:
    #     nil pointer evaluating interface {}.enabled
    # (dev và local thoát được chỉ vì tls.enabled=false làm `and` short-circuit
    #  — một sự may mắn, không phải thiết kế.)
    selfSignedIssuer:
      enabled: false
      name: selfsigned-issuer
      # true  -> tạo CA gốc tự ký rồi dùng CA đó ký cert cho Ingress
      #          (một CA duy nhất để tin tưởng, giống CA nội bộ thật)
      # false -> Issuer tự ký thẳng cert cho Ingress (mỗi cert là một gốc riêng)
      useCA: true
      # CA TỰ MANG: tên Secret kubernetes.io/tls đã tạo sẵn (cùng namespace).
      # Đặt giá trị này thì chart BỎ QUA useCA và không sinh CA nữa — nó chỉ tạo
      # Issuer kind: ca trỏ vào Secret đó.
      #
      # Vì sao nên dùng: CA do cert-manager sinh gắn với vòng đời release; gỡ
      # chart rồi cài lại là CA mới, thumbprint mới, và cái đã cài vào trust
      # store của máy thành vô dụng. CA tự mang sống độc lập với Helm.
      # Tạo bằng: scripts\helm\New-LocalCA.ps1
      existingCaSecret: ""
      caCommonName: trading-local-ca
      caDuration: 8760h    # 1 năm
      certDuration: 2160h  # 90 ngày — giống Let's Encrypt để lộ sớm lỗi gia hạn
      certRenewBefore: 360h
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"

# ---------------------------------------------------------------------------
# NetworkPolicy
# ---------------------------------------------------------------------------
networkPolicy:
  enabled: true
  externalDb:
    enabled: false
    cidr: 10.0.0.0/8
  externalKafka:
    enabled: false
    cidr: 10.0.0.0/8
  externalKafkaPlatform:
    enabled: false
    cidr: 10.0.0.0/8

# ---------------------------------------------------------------------------
# LimitRange & ResourceQuota
# ---------------------------------------------------------------------------
limitRange:
  default:
    cpu: 500m
    memory: 512Mi
  defaultRequest:
    cpu: 100m
    memory: 128Mi
  max:
    cpu: "2"
    memory: 2Gi
  min:
    cpu: 10m
    memory: 32Mi

resourceQuota:
  requests:
    cpu: "8"
    memory: 8Gi
  limits:
    cpu: "16"
    memory: 16Gi
  pods: "30"
