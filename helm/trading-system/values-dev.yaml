# =============================================================================
# values-dev.yaml — Tương đương k8s/overlays/dev
# Deploy: helm upgrade --install trading ./helm/trading-system \
#           -f ./helm/trading-system/values-dev.yaml -n trading-dev --create-namespace
# =============================================================================

postgres:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

kafka:
  enabled: true
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 640Mi }

redis:
  enabled: true
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 64Mi }

schemaRegistry:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

zipkin:
  enabled: true
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 128Mi }

prometheus:
  inCluster:
    enabled: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

monitoring:
  enabled: false

keda:
  enabled: false

externalSecrets:
  enabled: false

priorityClass:
  enabled: false

config:
  KAFKA_BOOTSTRAP: "kafka-0.kafka.trading-dev.svc.cluster.local:9092"
  KAFKA_PARTITIONS: "3"
  KAFKA_TOPIC_REPLICAS: "1"
  TRACING_PROBABILITY: "1.0"
  SIMULATED_FEED: "true"
  OUTBOX_RELAY_ENABLED: "true"
  LOGGING_LEVEL_COM_TRADING: "DEBUG"

secrets:
  create: true
  DB_USER: trading
  DB_PASSWORD: "changeme"
  ORDER_API_KEY: "dev-key"

marketGateway:
  replicaCount: 1
  image:
    repository: trading/market-gateway
    tag: dev
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 384Mi }

pricingRiskService:
  replicaCount: 1
  image:
    repository: trading/pricing-risk-service
    tag: dev
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 384Mi }

orderService:
  replicaCount: 1
  image:
    repository: trading/order-service
    tag: dev
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 384Mi }

matchingEngine:
  replicaCount: 1
  image:
    repository: trading/matching-engine
    tag: dev
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 384Mi }

ingress:
  host: trading.local
  tls:
    enabled: false

resourceQuota:
  requests:
    cpu: "4"
    memory: 4Gi
  limits:
    cpu: "8"
    memory: 8Gi
  pods: "20"
