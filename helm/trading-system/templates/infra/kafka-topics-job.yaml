{{- if and .Values.kafka.enabled .Values.kafkaTopicsJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: init-kafka-topics
  labels:
    app.kubernetes.io/name: init-kafka-topics
    app.kubernetes.io/component: bootstrap
    {{- include "trading.commonLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: init-kafka-topics
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: topics
          image: {{ .Values.kafka.image }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: trading-config }
          env:
            - name: KAFKA_HEAP_OPTS
              value: "-Xms64m -Xmx256m"
          command:
            - sh
            - -c
            - |
              set -eu
              BS="$KAFKA_BOOTSTRAP"
              P="$KAFKA_PARTITIONS"
              RF="$KAFKA_TOPIC_REPLICAS"

              echo "waiting for kafka at $BS"
              until /opt/kafka/bin/kafka-broker-api-versions.sh \
                      --bootstrap-server "$BS" >/dev/null 2>&1; do
                echo "  ... broker chua san sang"; sleep 5
              done

              create_topic() {
                T=$1; RET=$2
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BS" \
                  --create --if-not-exists --topic "$T" \
                  --partitions "$P" --replication-factor "$RF" \
                  --config retention.ms="$RET"

                /opt/kafka/bin/kafka-configs.sh --bootstrap-server "$BS" \
                  --entity-type topics --entity-name "$T" \
                  --alter --add-config retention.ms="$RET" >/dev/null || true

                CUR=$(/opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BS" \
                        --describe --topic "$T" | grep -c "Partition:" || true)
                if [ "$CUR" -lt "$P" ]; then
                  echo "  tang partition $T: $CUR -> $P"
                  /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BS" \
                    --alter --topic "$T" --partitions "$P"
                fi
                echo "  ok $T (partitions=$P rf=$RF retention.ms=$RET)"
              }

              for T in stock.ticks stock.enriched stock.orders stock.executions; do
                create_topic "$T" "604800000"
              done
              for T in stock.ticks.DLT stock.enriched.DLT stock.orders.DLT stock.executions.DLT; do
                create_topic "$T" "2592000000"
              done
              echo "kafka topics san sang"
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits:   { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 32Mi }
{{- end }}
