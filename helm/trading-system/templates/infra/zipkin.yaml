{{- if .Values.zipkin.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  labels:
    app.kubernetes.io/name: zipkin
    app.kubernetes.io/component: tracing
    {{- include "trading.commonLabels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: zipkin
  ports:
    - { name: http, port: 9411, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  labels:
    app.kubernetes.io/name: zipkin
    app.kubernetes.io/component: tracing
    {{- include "trading.commonLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zipkin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zipkin
        app.kubernetes.io/component: tracing
        app.kubernetes.io/part-of: {{ .Values.global.partOf }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: zipkin
          image: {{ .Values.zipkin.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 9411 }
          env:
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=70"
            - name: STORAGE_TYPE
              value: mem
            - name: MEM_MAX_SPANS
              value: "200000"
          resources:
            {{- toYaml .Values.zipkin.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
{{- end }}
