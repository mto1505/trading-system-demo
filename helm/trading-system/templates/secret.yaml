{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: trading-secrets
  labels:
    {{- include "trading.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.secrets.DB_USER | quote }}
  DB_PASSWORD: {{ .Values.secrets.DB_PASSWORD | quote }}
  ORDER_API_KEY: {{ .Values.secrets.ORDER_API_KEY | quote }}
{{- end }}
