apiVersion: v1
kind: ServiceAccount
metadata:
  name: market-gateway
  labels:
    {{- include "trading.commonLabels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: market-gateway
  labels:
    {{ include "trading.appLabels" (dict "name" "market-gateway" "component" .Values.marketGateway.component "context" .) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: market-gateway
  ports:
    - { name: http, port: {{ .Values.marketGateway.port }}, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-gateway
  labels:
    {{ include "trading.appLabels" (dict "name" "market-gateway" "component" .Values.marketGateway.component "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.marketGateway.replicaCount }}
  revisionHistoryLimit: 5
  minReadySeconds: 15
  progressDeadlineSeconds: 600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: market-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: market-gateway
        app.kubernetes.io/component: {{ .Values.marketGateway.component }}
        app.kubernetes.io/part-of: {{ .Values.global.partOf }}
      annotations:
        {{ include "trading.prometheusAnnotations" (dict "port" .Values.marketGateway.port) | nindent 8 }}
        {{ include "trading.configChecksum" . | nindent 8 }}
    spec:
      serviceAccountName: market-gateway
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- include "trading.appPodSecurityContext" . | nindent 8 }}
      {{- if .Values.priorityClass.enabled }}
      priorityClassName: trading-critical
      {{- end }}
      containers:
        - name: app
          image: {{ include "trading.image" .Values.marketGateway.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: {{ .Values.marketGateway.port }}, protocol: TCP }
          envFrom:
            - configMapRef: { name: trading-config }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          resources:
            {{- toYaml .Values.marketGateway.resources | nindent 12 }}
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          securityContext:
            {{- include "trading.appContainerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 128Mi }
