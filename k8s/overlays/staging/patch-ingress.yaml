# TLS thật nhưng dùng Let's Encrypt STAGING issuer: rate limit của LE production
# rất dễ chạm khi môi trường này bị tạo/xoá liên tục. Chứng chỉ sẽ không được
# trình duyệt tin - đó là chủ ý.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trading
  namespace: trading        # khớp với base; namespace transformer chạy SAU patch
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
    - hosts: [trading-staging.example.com]
      secretName: trading-staging-tls
  rules:
    - host: trading-staging.example.com
      http:
        paths:
          - path: /api/v1/orders
            pathType: Prefix
            backend:
              service: { name: order-service, port: { name: http } }
          - path: /api/v1/marketdata
            pathType: Prefix
            backend:
              service: { name: pricing-risk-service, port: { name: http } }
          - path: /api/v1/executions
            pathType: Prefix
            backend:
              service: { name: matching-engine, port: { name: http } }
          - path: /api/v1/ticks
            pathType: Prefix
            backend:
              service: { name: market-gateway, port: { name: http } }
