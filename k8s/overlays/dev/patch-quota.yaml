apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
  namespace: trading
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 10Gi
    limits.memory: 12Gi
    persistentvolumeclaims: "4"
    requests.storage: 20Gi
    pods: "20"
    services.loadbalancers: "0"
    services.nodeports: "0"
