# Prod: TLS thật + rate limit ở tầng edge.
#
# ĐÃ GỠ /api/v1/ticks: đó là endpoint bơm tick THỦ CÔNG, dùng để test. Để lộ
# ra Internet nghĩa là ai cũng tiêm được giá giả vào sàn.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trading
  namespace: trading
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Thô nhưng hiệu quả: tuyến phòng thủ đầu tiên trước scraper và dò API key.
    # Ứng dụng vẫn có rate limiter riêng (resilience4j, 200 lệnh/giây/pod).
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
spec:
  tls:
    - hosts: [trading.example.com]       # >>> SỬA domain thật <<<
      secretName: trading-tls
  rules:
    - host: trading.example.com
      http:
        paths:
          - path: /api/v1/orders
            pathType: Prefix
            backend:
              service: { name: order-service, port: { name: http } }
          - path: /api/v1/marketdata
            pathType: Prefix
            backend:
              service: { name: pricing-risk-service, port: { name: http } }
          - path: /api/v1/executions
            pathType: Prefix
            backend:
              service: { name: matching-engine, port: { name: http } }
