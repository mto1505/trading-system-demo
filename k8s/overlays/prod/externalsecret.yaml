# Mật khẩu prod KHÔNG nằm trong git. External Secrets Operator kéo từ nguồn
# thật (Vault / AWS Secrets Manager / GCP Secret Manager) và dựng ra Secret
# `trading-secrets` mà base đang tham chiếu.
#
# Cài trước:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets \
#        -n external-secrets --create-namespace
# và tạo một ClusterSecretStore tên `trading-prod` (xem k8s/cluster/).
#
# LƯU Ý: Secret này KHÔNG có hash suffix (không do kustomize sinh ra), nên đổi
# mật khẩu sẽ KHÔNG tự rolling restart. Xoay mật khẩu xong phải chạy:
#   kubectl rollout restart deploy -n trading-prod -l app.kubernetes.io/part-of=trading-system
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: trading-secrets
  namespace: trading
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: trading-prod
    kind: ClusterSecretStore
  target:
    name: trading-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef: { key: trading/prod/database, property: username }
    - secretKey: DB_PASSWORD
      remoteRef: { key: trading/prod/database, property: password }
    - secretKey: ORDER_API_KEY
      remoteRef: { key: trading/prod/api, property: order_api_key }
