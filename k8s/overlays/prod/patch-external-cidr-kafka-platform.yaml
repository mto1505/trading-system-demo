# Schema Registry và Job tạo topic cũng phải ra được Kafka ngoài - cùng CIDR
# với policy của 4 service ứng dụng. Quên file này thì schema-registry sẽ
# treo ở readiness mà log không nói rõ lý do (NetworkPolicy drop im lặng).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-kafka-egress-platform
  namespace: trading
spec:
  egress:
    - to:
        - ipBlock:
            cidr: 10.100.2.0/24
      ports:
        - { protocol: TCP, port: 9092 }
        - { protocol: TCP, port: 9094 }
