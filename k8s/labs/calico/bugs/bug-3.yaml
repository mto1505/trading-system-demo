# Thử thách 3. KHÔNG phải sự cố mất kết nối — ngược lại, mọi thứ "chạy tốt".
# Ý định của tác giả: "chỉ cho pod monitoring ở namespace tier=external vào".
# Hãy đo xem thực tế ai vào được, rồi nói xem lỗ hổng nằm ở đâu.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-allow-monitoring
  namespace: calico-lab
spec:
  podSelector:
    matchLabels: { app: backend }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { tier: external }
        - podSelector:
            matchLabels: { app: ext-client }
