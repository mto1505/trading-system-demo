# ⚠️ FILE NÀY CỐ TÌNH SAI — dùng ở Bài 7 để thấy bẫy DNAT.
# Người viết nghĩ "mình gọi backend:8080 thì mở 8080", nhưng kube-proxy đã DNAT
# 8080 -> 80 TRƯỚC khi Calico xét policy. Rule này không bao giờ khớp.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-allow-to-backend
  namespace: calico-lab
spec:
  podSelector:
    matchLabels: { app: frontend }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: backend }
      ports:
        - { protocol: TCP, port: 8080 }   # <-- SAI: đây là cổng Service
