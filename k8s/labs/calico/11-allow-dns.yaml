# Mở DNS cho MỌI pod trong namespace. Thiếu cái này thì mọi tên miền đều hỏng
# trong khi ping thẳng IP vẫn chạy -> triệu chứng rất dễ chẩn nhầm.
# Cần CẢ UDP lẫn TCP 53: resolver tự nhảy sang TCP khi câu trả lời > 512 byte.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: calico-lab
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
