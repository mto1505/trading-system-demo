# 4 pod trong calico-lab + 2 pod ở namespace ngoài.
#   client (netshoot) : có curl, nc, dig, tcpdump  -> dùng để THỬ đường mạng
#   server (nginx)    : nghe cổng 80               -> dùng làm ĐÍCH
# Dùng Pod tên cố định (không Deployment) để `kubectl exec frontend` luôn đúng.
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: calico-lab
  labels: { app: frontend, role: client, tier: web }
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: shell
      image: nicolaka/netshoot:latest
      command: ["sleep", "infinity"]
---
# Pod "lạ": không có nhãn nào được policy nhắc tới. Mọi bài lab đều phải chặn nó.
apiVersion: v1
kind: Pod
metadata:
  name: attacker
  namespace: calico-lab
  labels: { app: attacker, role: client }
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: shell
      image: nicolaka/netshoot:latest
      command: ["sleep", "infinity"]
---
apiVersion: v1
kind: Pod
metadata:
  name: backend
  namespace: calico-lab
  labels: { app: backend, tier: api }
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      ports: [{ containerPort: 80 }]
---
# CHÚ Ý: port 8080 -> targetPort 80. Chênh lệch này là nguyên liệu của Bài 7.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: calico-lab
spec:
  selector: { app: backend }
  ports:
    - { name: http, protocol: TCP, port: 8080, targetPort: 80 }
---
apiVersion: v1
kind: Pod
metadata:
  name: database
  namespace: calico-lab
  labels: { app: database, tier: data }
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: calico-lab
spec:
  selector: { app: database }
  ports:
    - { name: http, protocol: TCP, port: 80, targetPort: 80 }
---
apiVersion: v1
kind: Pod
metadata:
  name: ext-client
  namespace: calico-lab-ext
  labels: { app: ext-client, role: client }
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: shell
      image: nicolaka/netshoot:latest
      command: ["sleep", "infinity"]
---
# Cùng namespace với ext-client nhưng KHÁC nhãn pod. Cặp này là cách duy nhất
# phân biệt được bẫy AND/OR ở Bài 5.
apiVersion: v1
kind: Pod
metadata:
  name: ext-attacker
  namespace: calico-lab-ext
  labels: { app: ext-attacker, role: client }
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: shell
      image: nicolaka/netshoot:latest
      command: ["sleep", "infinity"]
