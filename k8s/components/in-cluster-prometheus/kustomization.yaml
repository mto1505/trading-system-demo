apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Prometheus "cây nhà lá vườn" cho cluster chưa có kube-prometheus-stack.
# Dùng component `monitoring` thay thế khi đã có Prometheus Operator.
resources:
  - prometheus.yaml

configMapGenerator:
  - name: prometheus-config
    files:
      - files/prometheus.yml
