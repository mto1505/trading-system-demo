# Một ServiceMonitor phủ cả 4 service: chọn theo label chứ không liệt kê tên,
# nên thêm service mới là tự động được scrape.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: trading-system
  namespace: trading
  labels:
    app.kubernetes.io/part-of: trading-system
spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [gateway, pricing, order, matching]
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s
      relabelings:
        # Giữ tên pod để truy ngược một pod/node lỗi từ biểu đồ.
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          targetLabel: application
