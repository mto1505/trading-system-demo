apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-gateway
  namespace: trading
spec:
  replicas: 1        # gateway thường gắn với 1 session feed -> cẩn thận khi scale >1
  selector:
    matchLabels: { app: market-gateway }
  template:
    metadata:
      labels: { app: market-gateway }
      annotations:
        # Prometheus (kubernetes_sd) scrape qua annotation
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      # Đủ thời gian cho graceful shutdown: xử lý nốt request/message đang chạy
      # và commit offset cuối trước khi bị SIGKILL (mặc định 30s là sát nút)
      terminationGracePeriodSeconds: 45
      containers:
        - name: market-gateway
          image: trading/market-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8081 }]
          env:
            - name: KAFKA_BOOTSTRAP
              value: kafka-0.kafka.trading.svc.cluster.local:9092
            - name: ZIPKIN_ENDPOINT
              value: http://zipkin.trading.svc.cluster.local:9411/api/v2/spans
            - name: SCHEMA_REGISTRY_URL
              value: http://schema-registry.trading.svc.cluster.local:8081
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          # Probe khác nhau: liveness = JVM sống, readiness = sẵn sàng nhận traffic
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: market-gateway
  namespace: trading
spec:
  selector: { app: market-gateway }
  ports: [{ port: 8081 }]
