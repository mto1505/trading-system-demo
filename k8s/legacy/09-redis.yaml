# Redis cache idempotency. Demo 1 replica; production: Redis Sentinel/Cluster
# hoặc managed. LƯU Ý THIẾT KẾ: Redis chỉ là CACHE - nó chết, dedupe vẫn đúng
# nhờ DB unique constraint. Vì vậy 1 replica là chấp nhận được.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: trading
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: trading
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
