apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-risk-service
  namespace: trading
spec:
  replicas: 2        # 2 pod x concurrency 3 = 6 consumer = 6 partition (khớp 100%)
  selector:
    matchLabels: { app: pricing-risk-service }
  template:
    metadata:
      labels: { app: pricing-risk-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      # Đủ thời gian cho graceful shutdown: xử lý nốt request/message đang chạy
      # và commit offset cuối trước khi bị SIGKILL (mặc định 30s là sát nút)
      terminationGracePeriodSeconds: 45
      containers:
        - name: pricing-risk-service
          image: trading/pricing-risk-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8082 }]
          env:
            - name: KAFKA_BOOTSTRAP
              value: kafka-0.kafka.trading.svc.cluster.local:9092
            - name: ZIPKIN_ENDPOINT
              value: http://zipkin.trading.svc.cluster.local:9411/api/v2/spans
            - name: SCHEMA_REGISTRY_URL
              value: http://schema-registry.trading.svc.cluster.local:8081
            - name: DB_HOST
              value: postgres.trading.svc.cluster.local
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: db-credentials, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: password } }
          resources:
            requests: { cpu: 500m, memory: 768Mi }
            limits: { cpu: "2", memory: 1536Mi }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            initialDelaySeconds: 40
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8082 }
            initialDelaySeconds: 25
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-risk-service
  namespace: trading
spec:
  selector: { app: pricing-risk-service }
  ports: [{ port: 8082 }]
---
# HPA CPU-based (LEGACY - khuyến nghị dùng KEDA ở 08-keda-scaledobject.yaml thay thế;
# nếu apply KEDA thì XOÁ HPA này đi, không chạy song song).
# LƯU Ý QUAN TRỌNG: maxReplicas KHÔNG nên vượt (số partition / concurrency).
# 6 partition / concurrency 3 = tối đa 2 pod dùng hiệu quả cho consumer;
# pod thứ 3+ chỉ giúp REST API. Muốn scale consumer cao hơn -> tăng partition trước.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pricing-risk-hpa
  namespace: trading
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pricing-risk-service
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # tránh flapping: chờ 5 phút mới scale down
