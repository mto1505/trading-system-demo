# Prometheus tối giản với kubernetes_sd (tự phát hiện pod qua annotation).
# PRODUCTION: dùng kube-prometheus-stack (Helm) - có sẵn Grafana, Alertmanager,
# node-exporter, dashboards, ServiceMonitor CRD.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: trading
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [trading] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: application
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: trading
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-trading
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-trading
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-trading
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: trading
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: trading
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: trading
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090 }]
