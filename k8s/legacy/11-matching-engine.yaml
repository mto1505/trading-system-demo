apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-engine
  namespace: trading
spec:
  replicas: 2
  selector:
    matchLabels: { app: matching-engine }
  template:
    metadata:
      labels: { app: matching-engine }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      # Đủ thời gian cho graceful shutdown: xử lý nốt request/message đang chạy
      # và commit offset cuối trước khi bị SIGKILL (mặc định 30s là sát nút)
      terminationGracePeriodSeconds: 45
      containers:
        - name: matching-engine
          image: trading/matching-engine:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8084 }]
          env:
            - name: KAFKA_BOOTSTRAP
              value: kafka-0.kafka.trading.svc.cluster.local:9092
            - name: DB_HOST
              value: postgres.trading.svc.cluster.local
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: db-credentials, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: password } }
            - name: ZIPKIN_ENDPOINT
              value: http://zipkin.trading.svc.cluster.local:9411/api/v2/spans
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8084 }
            initialDelaySeconds: 40
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8084 }
            initialDelaySeconds: 25
---
apiVersion: v1
kind: Service
metadata:
  name: matching-engine
  namespace: trading
spec:
  selector: { app: matching-engine }
  ports: [{ port: 8084 }]
