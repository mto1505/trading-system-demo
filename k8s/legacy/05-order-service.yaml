apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: trading
spec:
  replicas: 2
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      # Đủ thời gian cho graceful shutdown: xử lý nốt request/message đang chạy
      # và commit offset cuối trước khi bị SIGKILL (mặc định 30s là sát nút)
      terminationGracePeriodSeconds: 45
      containers:
        - name: order-service
          image: trading/order-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8083 }]
          env:
            - name: KAFKA_BOOTSTRAP
              value: kafka-0.kafka.trading.svc.cluster.local:9092
            - name: ZIPKIN_ENDPOINT
              value: http://zipkin.trading.svc.cluster.local:9411/api/v2/spans
            - name: DB_HOST
              value: postgres.trading.svc.cluster.local
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: db-credentials, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: password } }
            - name: REDIS_HOST
              value: redis.trading.svc.cluster.local
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8083 }
            initialDelaySeconds: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8083 }
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: trading
spec:
  type: ClusterIP     # expose ra ngoài qua Ingress/API Gateway, không NodePort trực tiếp
  selector: { app: order-service }
  ports: [{ port: 8083 }]
