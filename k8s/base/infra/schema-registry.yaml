# Schema Registry giữ hợp đồng Avro giữa producer/consumer. Không có nó thì
# market-gateway và pricing-risk-service không serialize/deserialize được tick.
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  namespace: trading
  labels:
    app.kubernetes.io/name: schema-registry
    app.kubernetes.io/component: platform
    app.kubernetes.io/part-of: trading-system
spec:
  selector:
    app.kubernetes.io/name: schema-registry
  ports:
    - { name: http, port: 8081, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: trading
  labels:
    app.kubernetes.io/name: schema-registry
    app.kubernetes.io/component: platform
    app.kubernetes.io/part-of: trading-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: schema-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schema-registry
        app.kubernetes.io/component: platform
        app.kubernetes.io/part-of: trading-system
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: schema-registry
          image: confluentinc/cp-schema-registry:7.6.1
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8081 }
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              value: schema-registry
            - name: SCHEMA_REGISTRY_LISTENERS
              value: http://0.0.0.0:8081
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              valueFrom: { configMapKeyRef: { name: trading-config, key: KAFKA_BOOTSTRAP } }
            - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR
              valueFrom: { configMapKeyRef: { name: trading-config, key: KAFKA_TOPIC_REPLICAS } }
            # FULL_TRANSITIVE: schema mới phải tương thích cả xuôi lẫn ngược với
            # TOÀN BỘ lịch sử. Với hệ giao dịch có replay từ offset cũ, chỉ
            # BACKWARD là chưa đủ - consumer mới vẫn phải đọc được bản ghi cũ.
            - name: SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL
              value: full_transitive
          resources:
            requests: { cpu: 100m, memory: 768Mi }
            limits:   { memory: 1Gi }
          startupProbe:
            httpGet: { path: /subjects, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /subjects, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /subjects, port: http }
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
