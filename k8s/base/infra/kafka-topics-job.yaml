# Tạo topic với SỐ PARTITION TƯỜNG MINH thay vì để auto-create.
#
# Vì sao quan trọng: trần scale của consumer = partition / concurrency.
# Cả 3 service consumer đều đặt concurrency = 3 (KafkaConfig.java), nên:
#     dev      3 partition  -> 1 pod là đủ
#     staging  6 partition  -> trần 2 pod
#     prod    12 partition  -> trần 4 pod  (khớp maxReplicaCount của KEDA)
# Auto-create đẻ topic 1 partition, mọi con số trên sập về 1 mà không ai hay.
#
# Job idempotent: --if-not-exists khi tạo, và chỉ TĂNG partition khi cần
# (Kafka không cho giảm). ttlSecondsAfterFinished để apply lại là chạy lại.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  namespace: trading
  labels:
    app.kubernetes.io/name: kafka-topics-init
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: trading-system
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-topics-init
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: topics
          image: apache/kafka:3.7.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: trading-config }
          env:
            - name: KAFKA_HEAP_OPTS
              value: "-Xms64m -Xmx256m"
          command:
            - sh
            - -c
            - |
              set -eu
              BS="$KAFKA_BOOTSTRAP"
              P="$KAFKA_PARTITIONS"
              RF="$KAFKA_TOPIC_REPLICAS"

              echo "waiting for kafka at $BS"
              until /opt/kafka/bin/kafka-broker-api-versions.sh \
                      --bootstrap-server "$BS" >/dev/null 2>&1; do
                echo "  ... broker chua san sang"; sleep 5
              done

              # Retention cua topic nghiep vu la MOT HOP DONG voi bang processed_event
              # cua matching-engine: job don processed_event PHAI giu lau HON
              # retention nay. Don som hon = replay tu offset cu se khop lenh HAI LAN
              # vi ban ghi chong trung da bi xoa. Vi vay khai bao tuong minh o day
              # thay vi pho mac cho mac dinh cua broker.
              # DLT giu lau hon topic nghiep vu: do la du lieu chan doan.

              create_topic() {
                T=$1; RET=$2
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BS" \
                  --create --if-not-exists --topic "$T" \
                  --partitions "$P" --replication-factor "$RF" \
                  --config retention.ms="$RET"

                # Topic da ton tai thi --create khong dong gi: ap lai config va
                # partition cho khop khai bao.
                /opt/kafka/bin/kafka-configs.sh --bootstrap-server "$BS" \
                  --entity-type topics --entity-name "$T" \
                  --alter --add-config retention.ms="$RET" >/dev/null

                CUR=$(/opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BS" \
                        --describe --topic "$T" | grep -c "Partition:" || true)
                if [ "$CUR" -lt "$P" ]; then
                  echo "  tang partition $T: $CUR -> $P"
                  /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BS" \
                    --alter --topic "$T" --partitions "$P"
                fi
                echo "  ok $T (partitions=$P rf=$RF retention.ms=$RET)"
              }

              for T in stock.ticks stock.enriched stock.orders stock.executions; do
                create_topic "$T" "$TOPIC_RETENTION_MS"
              done
              # DLT giu CUNG so partition voi topic goc: DeadLetterPublishingRecoverer
              # gui vao dung partition cua ban ghi loi, DLT it partition hon se
              # publish that bai.
              for T in stock.ticks.DLT stock.enriched.DLT stock.orders.DLT stock.executions.DLT; do
                create_topic "$T" "$DLT_RETENTION_MS"
              done
              echo "kafka topics san sang"
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits:   { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 32Mi }
