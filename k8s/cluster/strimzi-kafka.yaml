# Kafka cho PROD bằng Strimzi Operator, đặt ở namespace riêng.
# Đây là thứ mà component `external-kafka` trỏ tới: bootstrap trở thành
#   trading-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
#
# Cài Operator trước:
#   helm repo add strimzi https://strimzi.io/charts/
#   helm install strimzi strimzi/strimzi-kafka-operator -n kafka --create-namespace
#
# Vì sao Operator chứ không phải StatefulSet tự viết: rolling upgrade đúng thứ
# tự, rack-awareness, reassign partition khi đổi broker, xoay chứng chỉ TLS,
# quản lý KRaft quorum - mỗi thứ đều là một sự cố chờ xảy ra nếu làm tay.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: broker
  namespace: kafka
  labels:
    strimzi.io/cluster: trading-kafka
spec:
  replicas: 3
  roles: [broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 200Gi
        deleteClaim: false
  resources:
    requests: { cpu: "1", memory: 4Gi }
    limits:   { memory: 4Gi }
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: controller
  namespace: kafka
  labels:
    strimzi.io/cluster: trading-kafka
spec:
  replicas: 3
  roles: [controller]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 20Gi
        deleteClaim: false
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: trading-kafka
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.7.0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # RF 3 + minISR 2: chịu được mất 1 broker mà KHÔNG mất bản ghi đã ack.
      # Với luồng lệnh giao dịch, mất một lệnh đã ack là không chấp nhận được.
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      auto.create.topics.enable: "false"
      log.retention.hours: 168
    # Rack-awareness: bản sao của một partition không được nằm chung AZ.
    rack:
      topologyKey: topology.kubernetes.io/zone
  entityOperator:
    topicOperator: {}
    userOperator: {}
