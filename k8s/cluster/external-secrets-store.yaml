# ClusterSecretStore mà overlays/prod/externalsecret.yaml tham chiếu.
# Ví dụ dùng AWS Secrets Manager với IRSA - thay bằng Vault/GCP nếu cần.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: trading-prod
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1            # >>> SỬA <<<
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
