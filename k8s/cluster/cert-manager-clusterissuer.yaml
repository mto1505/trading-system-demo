# Tài nguyên CẤP CLUSTER - apply MỘT LẦN cho cả cluster, không nằm trong overlay.
#   kubectl apply -f k8s/cluster/cert-manager-clusterissuer.yaml
#
# Cần cert-manager cài trước:
#   helm repo add jetstack https://charts.jetstack.io
#   helm install cert-manager jetstack/cert-manager -n cert-manager \
#        --create-namespace --set crds.enabled=true
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: platform@example.com          # >>> SỬA <<<
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - http01:
          ingress: { ingressClassName: nginx }
---
# Issuer production của Let's Encrypt có RATE LIMIT thật (50 cert/domain/tuần).
# Vì vậy staging dùng issuer staging ở trên - cert không được tin nhưng không
# đốt hạn mức khi môi trường bị tạo/xoá liên tục.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform@example.com          # >>> SỬA <<<
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - http01:
          ingress: { ingressClassName: nginx }
