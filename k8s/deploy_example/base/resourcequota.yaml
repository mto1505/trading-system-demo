# Hard ceiling for the whole namespace, so a runaway HPA cannot eat the cluster.
# NOTE: naming a resource here makes it MANDATORY on every pod. `limits.cpu` is
# intentionally omitted so workloads may run without a CPU limit (see LimitRange).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
  namespace: taskapp
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.memory: 16Gi
    persistentvolumeclaims: "6"
    requests.storage: 60Gi
    pods: "40"
    services.loadbalancers: "1"
    services.nodeports: "0"      # nothing gets exposed via NodePort in this namespace
