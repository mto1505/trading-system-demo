apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: taskapp
  namespace: taskapp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: taskapp
      app.kubernetes.io/component: api
  policyTypes: [Ingress, Egress]
  ingress:
    # Public traffic: only from the ingress controller, only on 8080.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { protocol: TCP, port: 8080 }
    # Actuator (probes + metrics): only from the monitoring stack, only on 9090.
    # Kubelet probes are node-sourced and bypass NetworkPolicy, so they still work.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: 9090 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - { protocol: TCP, port: 5432 }
