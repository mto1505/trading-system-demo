apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskapp
  namespace: taskapp
  labels: &labels
    app.kubernetes.io/name: taskapp
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: task-platform
spec:
  replicas: 3
  revisionHistoryLimit: 5
  # A pod must stay Ready 15s before the rollout counts it as good. Catches
  # containers that pass readiness once and then crash.
  minReadySeconds: 15
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0        # never drop below the desired replica count mid-deploy
  selector:
    matchLabels:
      app.kubernetes.io/name: taskapp
      app.kubernetes.io/component: api
  template:
    metadata:
      labels: *labels
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: taskapp
      automountServiceAccountToken: false
      # 60s ceiling: preStop (5s) + graceful shutdown (30s) + headroom.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      # Spread replicas over zones first, then nodes. Losing one node or one AZ
      # must not take the service down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: taskapp
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: taskapp

      initContainers:
        # Flyway fails hard on an unreachable DB, so gate startup on the DB being up
        # instead of burning CrashLoopBackOff cycles.
        - name: wait-for-db
          image: postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$DB_HOST" -p 5432 -U "$PGUSER" -t 3; do
                echo "waiting for postgres at $DB_HOST:5432"
                sleep 2
              done
              echo "postgres is accepting connections"
          env:
            - name: DB_HOST
              value: postgres.taskapp.svc.cluster.local
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: APP_DB_USERNAME
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

      containers:
        - name: app
          image: ghcr.io/example/k8s-practice:REPLACED_BY_OVERLAY
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: APP_DB_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: APP_DB_PASSWORD
            # Surfaced in logs/metrics so a bad pod or node is identifiable.
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }

          resources:
            # memory request == limit: the pod is never evicted for memory pressure
            # caused by a noisy neighbour. CPU has no limit -> no throttling of
            # latency-sensitive request handling; the quota above bounds the total.
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 1Gi

          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 5
            failureThreshold: 30        # up to 150s for a cold JVM + Flyway migration
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3          # out of the Service after ~15s of DB trouble
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6          # deliberately slacker than readiness:
                                         # a sick DB must not restart healthy pods

          lifecycle:
            preStop:
              # Endpoints removal is asynchronous. Keep serving for 5s after the
              # pod is marked Terminating, otherwise clients get connection resets.
              sleep:
                seconds: 5

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        # Required because the root filesystem is read-only; the JVM needs scratch space.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
