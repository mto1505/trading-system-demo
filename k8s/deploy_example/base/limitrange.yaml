# Guarantees nothing lands in the namespace without resource bounds, even if a
# future manifest forgets them.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: taskapp
spec:
  limits:
    - type: Container
      default:
        # CPU is deliberately absent here AND in the ResourceQuota below.
        # A CPU limit means CFS throttling: a pod that briefly needs a burst gets
        # stalled for the rest of its 100ms quota window, which shows up as p99
        # latency spikes. CPU requests already give the scheduler what it needs.
        # Memory is different - it is not compressible, so it is always capped.
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        memory: 4Gi
      min:
        cpu: 10m
        memory: 32Mi
    - type: PersistentVolumeClaim
      max:
        storage: 100Gi
      min:
        storage: 1Gi
