apiVersion: v1
kind: Service
metadata:
  name: taskapp
  namespace: taskapp
  labels:
    app.kubernetes.io/name: taskapp
    app.kubernetes.io/component: api
spec:
  type: ClusterIP            # exposure happens through the Ingress, never NodePort
  selector:
    app.kubernetes.io/name: taskapp
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 9090
      targetPort: management
