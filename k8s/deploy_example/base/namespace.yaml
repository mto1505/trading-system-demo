apiVersion: v1
kind: Namespace
metadata:
  name: taskapp
  labels:
    # Pod Security Admission: reject any pod that is not "restricted" compliant.
    # This is what stops a bad manifest from running privileged/root in production.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
