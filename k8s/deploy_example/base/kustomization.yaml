apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: taskapp

resources:
  - namespace.yaml
  - limitrange.yaml
  - resourcequota.yaml
  # application
  - app-serviceaccount.yaml
  - app-deployment.yaml
  - app-service.yaml
  - app-pdb.yaml
  - app-hpa.yaml
  - app-ingress.yaml
  - app-networkpolicy.yaml
  # database
  - db-statefulset.yaml
  - db-service.yaml
  - db-pdb.yaml
  - db-networkpolicy.yaml
  - db-backup-cronjob.yaml
  # network baseline
  - networkpolicy-default-deny.yaml

configMapGenerator:
  # Generated rather than declared as a static resource: every config change
  # produces a new name hash, which forces a rolling restart. A plain ConfigMap
  # would leave pods running with stale values until someone restarts them by hand.
  - name: app-config
    envs:
      - files/app.env
  - name: postgres-init
    files:
      - files/10-app-role.sh

generatorOptions:
  disableNameSuffixHash: false

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: task-platform
      app.kubernetes.io/managed-by: kustomize
