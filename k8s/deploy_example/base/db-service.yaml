apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: taskapp
  labels:
    app.kubernetes.io/name: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
# Required by the StatefulSet for stable per-pod DNS (postgres-0.postgres-headless).
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: taskapp
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
