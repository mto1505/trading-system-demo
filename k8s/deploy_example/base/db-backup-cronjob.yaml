apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  namespace: taskapp
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: taskapp
  labels:
    app.kubernetes.io/name: postgres-backup
spec:
  schedule: "15 2 * * *"          # 02:15 daily
  timeZone: "Asia/Ho_Chi_Minh"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: pg-dump
              image: postgres:16.4-alpine
              command:
                - sh
                - -c
                - |
                  set -euo pipefail
                  STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
                  OUT="/backups/${POSTGRES_DB}-${STAMP}.dump"
                  echo "dumping ${POSTGRES_DB} -> ${OUT}"
                  pg_dump --host=postgres --username="$POSTGRES_USER" \
                          --dbname="$POSTGRES_DB" --format=custom --compress=9 \
                          --file="$OUT"
                  # Fail loudly if the dump is unreadable - an untested backup is not a backup.
                  pg_restore --list "$OUT" > /dev/null
                  echo "verified ${OUT} ($(du -h "$OUT" | cut -f1))"
                  find /backups -name '*.dump' -type f -mtime +14 -print -delete
              env:
                - name: POSTGRES_DB
                  valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_DB } }
                - name: POSTGRES_USER
                  valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_USER } }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_PASSWORD } }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits:   { memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: backups, mountPath: /backups }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
            - name: tmp
              emptyDir: {}
