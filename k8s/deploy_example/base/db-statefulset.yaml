apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: taskapp
  labels: &labels
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: task-platform
spec:
  # A Deployment with an RWO PVC deadlocks on rolling update (new pod cannot
  # attach the volume the old pod still holds). StatefulSet ordering fixes that,
  # and gives the pod a stable identity + its own PVC.
  serviceName: postgres-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels: *labels
    spec:
      terminationGracePeriodSeconds: 120   # let Postgres finish a checkpoint
      securityContext:
        runAsNonRoot: true
        runAsUser: 999          # the "postgres" user baked into the official image
        runAsGroup: 999
        fsGroup: 999            # makes the mounted PV writable by that user
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - max_connections=120
            - -c
            - shared_buffers=256MB
            - -c
            - effective_cache_size=768MB
            - -c
            - work_mem=8MB
            - -c
            - wal_level=replica
            - -c
            - log_min_duration_statement=500   # surface slow queries
            - -c
            - log_checkpoints=on
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            # PGDATA must be a SUBDIRECTORY of the mount: a PV root can contain
            # lost+found, which makes initdb refuse to start.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_PASSWORD } }
            - name: APP_DB_USERNAME
              valueFrom: { secretKeyRef: { name: db-credentials, key: APP_DB_USERNAME } }
            - name: APP_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: APP_DB_PASSWORD } }
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits:   { memory: 1Gi }
          startupProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"] }
            periodSeconds: 5
            failureThreshold: 60      # first boot runs initdb; give it 5 minutes
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"] }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -h 127.0.0.1"] }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data,     mountPath: /var/lib/postgresql/data }
            - { name: initdb,   mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            # Needed because the root filesystem is read-only.
            - { name: run,      mountPath: /var/run/postgresql }
            - { name: tmp,      mountPath: /tmp }
      volumes:
        - name: initdb
          configMap:
            name: postgres-init
            defaultMode: 0755
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
