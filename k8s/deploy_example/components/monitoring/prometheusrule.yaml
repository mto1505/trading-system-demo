apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: taskapp
  namespace: taskapp
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: taskapp.slo
      rules:
        # Symptom-based alerting (what users feel), not cause-based.
        - alert: TaskAppHighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{job="taskapp",status=~"5.."}[5m]))
              /
            sum(rate(http_server_requests_seconds_count{job="taskapp"}[5m])) > 0.02
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "Task API 5xx rate above 2% for 5 minutes"

        - alert: TaskAppHighLatency
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(http_server_requests_seconds_bucket{job="taskapp"}[5m]))
            ) > 1
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Task API p99 latency above 1s"

        - alert: TaskAppConnectionPoolSaturated
          expr: |
            hikaricp_connections_pending{job="taskapp"} > 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Threads are queuing for a DB connection - pool is too small"

        - alert: TaskAppPodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace=~"taskapp.*"}[15m]) * 900 > 3
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.pod }} restarted more than 3 times in 15 minutes"

    - name: taskapp.capacity
      rules:
        - alert: TaskAppHPAMaxedOut
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{namespace=~"taskapp.*"}
              >= kube_horizontalpodautoscaler_spec_max_replicas{namespace=~"taskapp.*"}
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "HPA is at maxReplicas - no headroom left"

        - alert: PostgresDiskFillingUp
          expr: |
            kubelet_volume_stats_available_bytes{namespace=~"taskapp.*",persistentvolumeclaim=~"data-postgres-.*"}
              / kubelet_volume_stats_capacity_bytes{namespace=~"taskapp.*",persistentvolumeclaim=~"data-postgres-.*"} < 0.15
          for: 10m
          labels: { severity: critical }
          annotations:
            summary: "PostgreSQL volume below 15% free"

        - alert: PostgresBackupMissing
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace=~"taskapp.*",cronjob="postgres-backup"} > 129600
          for: 1h
          labels: { severity: critical }
          annotations:
            summary: "No successful database backup in 36 hours"
