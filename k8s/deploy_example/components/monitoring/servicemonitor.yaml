apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: taskapp
  namespace: taskapp
  labels:
    release: kube-prometheus-stack   # must match the Prometheus serviceMonitorSelector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: taskapp
      app.kubernetes.io/component: api
  endpoints:
    - port: management
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
