apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Real production runs the database OUTSIDE the cluster (RDS / Cloud SQL / a
# CloudNativePG cluster in its own namespace). Add this component to strip the
# in-cluster StatefulSet and point the app at a managed endpoint instead:
#   components: [../../components/external-database]
patches:
  - path: remove-in-cluster-db.yaml
    target: { kind: StatefulSet, name: postgres }
  - path: remove-db-pdb.yaml
    target: { kind: PodDisruptionBudget, name: postgres }
  - path: allow-external-db-egress.yaml
