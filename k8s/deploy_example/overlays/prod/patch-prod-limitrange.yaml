apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: taskapp
spec:
  limits:
    - type: Container
      default:
        memory: 1Gi
      defaultRequest:
        cpu: 200m
        memory: 256Mi
      max:
        memory: 8Gi
      min:
        cpu: 10m
        memory: 64Mi
    - type: PersistentVolumeClaim
      max:
        storage: 500Gi     # base caps at 100Gi, which the prod data volume hits exactly
      min:
        storage: 1Gi
