# Cluster-scoped. Under node pressure the scheduler evicts lower-priority
# workloads before it touches the API pods.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: taskapp-critical
value: 1000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Customer-facing task API and its database."
