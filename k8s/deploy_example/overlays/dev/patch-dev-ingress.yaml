# No cert-manager on a laptop cluster: plain HTTP against a hosts-file entry.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskapp
  namespace: taskapp
  annotations:
    cert-manager.io/cluster-issuer: null
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
spec:
  tls: null
  rules:
    - host: tasks.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: taskapp
                port:
                  name: http
