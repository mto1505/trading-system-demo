# How production credentials actually reach the cluster: the External Secrets
# Operator pulls them from a vault and materialises a Secret named
# "db-credentials" in the namespace. Nothing sensitive ever touches git.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault
  namespace: taskapp-prod
spec:
  provider:
    vault:
      server: https://vault.internal.example.com
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: taskapp-prod
          serviceAccountRef:
            name: taskapp
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: taskapp-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: db-credentials        # the name the Deployment/StatefulSet expect
    creationPolicy: Owner
  data:
    - { secretKey: POSTGRES_DB,       remoteRef: { key: taskapp/prod/db, property: database } }
    - { secretKey: POSTGRES_USER,     remoteRef: { key: taskapp/prod/db, property: admin_user } }
    - { secretKey: POSTGRES_PASSWORD, remoteRef: { key: taskapp/prod/db, property: admin_password } }
    - { secretKey: APP_DB_USERNAME,   remoteRef: { key: taskapp/prod/db, property: app_user } }
    - { secretKey: APP_DB_PASSWORD,   remoteRef: { key: taskapp/prod/db, property: app_password } }
