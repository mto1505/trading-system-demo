# Overlay bật Debezium CDC thay cho polling relay.
#   docker compose -f docker-compose.yml -f docker-compose.cdc.yml up -d
# Bắt buộc: OUTBOX_RELAY_ENABLED=false ở các service có outbox, nếu không
# cả relay lẫn CDC cùng publish -> event nhân đôi (consumer dedupe được,
# nhưng tốn băng thông và làm nhiễu metric).
services:
  postgres:
    command: >
      postgres -c wal_level=logical
               -c max_wal_senders=10
               -c max_replication_slots=10

  connect:
    image: debezium/connect:2.6
    ports: ["8083:8083"]      # REST API của Kafka Connect (khác cổng order-service)
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: debezium-cdc
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
    depends_on: [kafka, postgres]

  order-service:
    environment:
      OUTBOX_RELAY_ENABLED: "false"

  matching-engine:
    environment:
      OUTBOX_RELAY_ENABLED: "false"
